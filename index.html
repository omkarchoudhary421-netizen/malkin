<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 🐱</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}

body{
  background:#fff7f2;
  overflow:hidden;
}

.slide{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  opacity:0;
  transform:scale(0.97);
  transition:0.6s ease;
}

.slide.active{
  opacity:1;
  transform:scale(1);
}

.emoji{
  font-size:90px;
  line-height:1;
}

.stickers{
  font-size:26px;
  margin-top:10px;
  opacity:0.8;
}

.text{
  font-size:22px;
  margin-top:18px;
  color:#444;
  line-height:1.4;
}

.small{
  font-size:14px;
  margin-top:10px;
  opacity:0.6;
}
</style>
</head>

<body>

<!-- Slide 1 -->
<div class="slide active">
  <div class="emoji">🐱</div>
  <div class="stickers">🐾 🐾</div>
  <div class="text">Hi… I came to see you</div>
  <div class="small">tap anywhere 🐾</div>
</div>

<!-- Slide 2 : Cat holding rose -->
<div class="slide">
  <div class="emoji">🐱🤲🌹</div>
  <div class="stickers">😽 🐾 💕</div>
  <div class="text">
    This rose is for my malkin 🌹<br>
    from your joru ka gulam 🐱
  </div>
  <div class="small">bas dil se 🤍</div>
</div>

<!-- Slide 3 -->
<div class="slide">
  <div class="emoji">🐱🧸</div>
  <div class="stickers">🤍 🐾 🤍</div>
  <div class="text">And a teddy…</div>
  <div class="small">for extra comfort</div>
</div>

<!-- Slide 4 -->
<div class="slide">
  <div class="emoji">🐱💖</div>
  <div class="stickers">🐾 💕 🐾</div>
  <div class="text">Hope this made you smile</div>
  <div class="small">that’s all 🫶</div>
</div>

<script>
const slides = document.querySelectorAll(".slide");
let index = 0;

document.body.addEventListener("click", () => {
  slides[index].classList.remove("active");
  index = (index + 1) % slides.length;
  slides[index].classList.add("active");
});
</script>

</body>
</html>
